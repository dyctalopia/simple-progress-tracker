<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>進度追蹤</title>
  <style>
    /* ========================================
       Reset & Base
    ======================================== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ========================================
       Design Tokens
    ======================================== */
    :root {
      --bg:        #0f1115;
      --surface:   #171a20;
      --surface-2: #1f232c;
      --border:    #252830;
      --text-pri:  #e8e8e8;
      --text-sec:  #6b7280;
      --done-text: #6b7280;
      --green:     #22c55e;
      --orange:    f59e0b;
      --red:       #ef4444;
      --font:      "Inter", "Noto Sans TC", system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-pri);
      min-height: 100vh;
      padding: 40px 16px;
    }

    .page-header {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-pri);
    }

    .page-hint {
      font-size: 0.7rem;
      color: var(--text-sec);
    }

    /* ========================================
       Project Section
    ======================================== */
    .project-section {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto 40px;
    }

    .project-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .project-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-pri);
    }

    .project-meta {
      font-size: 0.65rem;
      color: var(--text-sec);
      margin-left: auto;
    }

    /* ========================================
       Mode toggle (edit / view)
    ======================================== */
    .mode-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-pri);
      padding: 6px 12px;
      border-radius: 6px;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .mode-toggle:hover { border-color: var(--text-pri); }
    .mode-toggle.active { border-color: var(--green); color: var(--green); }

    /* ========================================
       Timeline (view mode)
    ======================================== */
    .timeline {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: center;
      gap: 12px;
    }

    .phase {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      padding-top: 22px;
      min-width: 140px;
      max-width: 180px;
      text-align: center;
      flex: 1 1 140px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      user-select: none;
    }

    .phase .checkbox {
      position: absolute;
      top: 10px;
      left: 12px;
    }

    .phase .checkbox input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      background: transparent;
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      transition: border-color 0.15s;
    }

    .phase .checkbox input[type="checkbox"]::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 10px;
      height: 10px;
      border-radius: 2px;
      transition: transform 0.15s, background-color 0.15s;
    }

    .phase .checkbox input[type="checkbox"]:checked::after {
      transform: translate(-50%, -50%) scale(1);
    }

    .phase.done    .checkbox input[type="checkbox"]                       { border-color: var(--border); }
    .phase.done    .checkbox input[type="checkbox"]:checked::after      { background-color: var(--border); }
    .phase.current .checkbox input[type="checkbox"]                       { border-color: var(--green); }
    .phase.current .checkbox input[type="checkbox"]:checked::after      { background-color: var(--green); }
    .phase.warning .checkbox input[type="checkbox"]                       { border-color: var(--orange); }
    .phase.warning .checkbox input[type="checkbox"]:checked::after      { background-color: var(--orange); }
    .phase.urgent  .checkbox input[type="checkbox"]                       { border-color: var(--red); }
    .phase.urgent  .checkbox input[type="checkbox"]:checked::after       { background-color: var(--red); }

    .phase .title     { font-size: 0.875rem; font-weight: 600; color: var(--text-pri); margin-bottom: 4px; }
    .phase .date      { font-size: 0.65rem;   color: var(--text-sec); margin-bottom: 10px; }
    .phase .header    { font-size: 0.65rem;   font-weight: 600; letter-spacing: 0.08em; color: var(--text-sec); }
    .phase .days      { font-size: 2.2rem;    font-weight: 700; line-height: 1; color: var(--text-sec); margin-bottom: 2px; }
    .phase .days-unit { font-size: 0.6rem;    font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-sec); }

    .phase.done {
      border-color: var(--border);
    }
    .phase.done .title  { color: var(--done-text); }
    .phase.done .header { color: var(--done-text); }
    .phase.current {
      border-color: var(--green);
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.15);
    }
    .phase.current .header { color: var(--green); }
    .phase.current .days   { color: var(--green); }
    .phase.warning {
      border-color: var(--orange);
      box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.12);
    }
    .phase.warning .header { color: var(--orange); }
    .phase.warning .days   { color: var(--orange); }
    .phase.urgent {
      border-color: var(--red);
      box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.15);
    }
    .phase.urgent .header  { color: var(--red); }
    .phase.urgent .days    { color: var(--red); }

    /* ========================================
       Editor panel
    ======================================== */
    .editor {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }
    .editor .editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .editor .editor-head h2 {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .btn {
      background: var(--surface-2);
      color: var(--text-pri);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn:hover { border-color: var(--text-pri); }
    .btn-primary { border-color: var(--green); color: var(--green); }
    .btn-primary:hover { background: rgba(34, 197, 94, 0.1); }
    .btn-danger { border-color: var(--red); color: var(--red); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .editor .editor-rows {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Project editor */
    .proj-row {
      display: grid;
      grid-template-columns: 2fr 1fr 36px;
      gap: 8px;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .proj-row input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-pri);
      padding: 6px 8px;
      border-radius: 4px;
      font: inherit;
      font-size: 0.85rem;
      font-family: inherit;
      width: 100%;
    }
    .proj-row input:focus {
      outline: none;
      border-color: var(--green);
    }
    .proj-row .del {
      background: transparent;
      color: var(--text-sec);
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      transition: color 0.15s, border-color 0.15s;
    }
    .proj-row .del:hover { color: var(--red); border-color: var(--red); }

    /* Phase editor per project */
    .phase-edit-block {
      margin-bottom: 16px;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .phase-edit-block .proj-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sec);
      margin-bottom: 8px;
      letter-spacing: 0.06em;
    }
    .phase-rows {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .edit-row {
      display: grid;
      grid-template-columns: 1fr 100px 100px 36px;
      gap: 8px;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
    }
    .edit-row input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-pri);
      padding: 6px 8px;
      border-radius: 4px;
      font: inherit;
      font-size: 0.85rem;
      font-family: inherit;
      width: 100%;
    }
    .edit-row input:focus {
      outline: none;
      border-color: var(--green);
    }
    .edit-row input.date {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .edit-row .del {
      background: transparent;
      color: var(--text-sec);
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      transition: color 0.15s, border-color 0.15s;
    }
    .edit-row .del:hover { color: var(--red); border-color: var(--red); }

    .add-row {
      width: 100%;
      background: transparent;
      color: var(--text-sec);
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 10px;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 4px;
      transition: color 0.15s, border-color 0.15s;
    }
    .add-row:hover { color: var(--green); border-color: var(--green); }

    .editor-foot {
      margin-top: 14px;
      font-size: 0.7rem;
      color: var(--text-sec);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ========================================
       Conflict banner
    ======================================== */
    .conflict-banner {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto 24px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.8rem;
      color: #ef4444;
      display: none;
    }
    .conflict-banner.visible { display: block; }
    .conflict-banner strong { font-weight: 600; }

    /* ========================================
       Responsive
    ======================================== */
    @media (max-width: 640px) {
      .phase {
        min-width: 120px;
        flex: 1 1 120px;
        padding: 12px 14px;
        padding-top: 20px;
      }
      .edit-row { grid-template-columns: 1fr 80px 80px 32px; }
      .proj-row { grid-template-columns: 1fr 36px; }
      .proj-row input[type="text"] { display: none; }
      .proj-row .proj-name-display {
        display: block;
        font-size: 0.85rem;
        color: var(--text-pri);
        padding: 6px 0;
      }
    }
  </style>
</head>
<body>

  <div class="page-header">
    <div>
      <div class="page-title">📋 進度追蹤</div>
      <div class="page-hint" id="updated-at"></div>
    </div>
    <button class="mode-toggle" id="mode-toggle" type="button">✎ 編輯</button>
  </div>

  <div class="conflict-banner" id="conflict-banner">
    ⚠ <strong>時程衝突：</strong><span id="conflict-text"></span>
  </div>

  <div id="projects-container"></div>

  <div class="editor" id="editor" hidden></div>

  <script>
    /* ========================================
       CONFIG — 編輯這個區塊來新增 / 修改專案
       每個專案：
         name       — 顯示名稱
         phases     — 陣列，每項 { title, startDate, endDate }
       直接修改儲存後，刷新瀏覽器即可。
    ======================================== */
    var CONFIG = {
      updatedAt: '2026-06-30',
      projects: [
        {
          name: 'TNL-口腔司 2D 動畫',
          phases: [
            { title: '前置作業', startDate: '5/22', endDate: '5/23' },
            { title: '腳本定稿', startDate: '5/28', endDate: '6/15' },
            { title: '分鏡完稿', startDate: '6/16', endDate: '6/22' },
            { title: 'A Copy',   startDate: '6/23', endDate: '6/29' },
            { title: 'B Copy',   startDate: '6/30', endDate: '7/02' },
            { title: 'Final',    startDate: '7/03', endDate: '7/05' }
          ]
        }
        /* ══════════════════════════════════════════
           在上方最後一個專案結尾 } 後加上逗號，
           即可新增下一個專案，格式如下：
           ,
           {
             name: '專案名稱',
             phases: [
               { title: '任務', startDate: 'M/D', endDate: 'M/D' }
             ]
           }
           ══════════════════════════════════════════ */
      ]
    };

    /* ========================================
       STATE
    ======================================== */
    var CHECKED_KEY = 'pt-checked';     // per-project checked index
    var VIEW_KEY    = 'pt-edit-mode';
    var SAVED_KEY   = 'pt-edit-draft';

    var state = {
      projects: [],       // loaded projects
      mode: 'view',
      editDraft: null,
    };

    /* ========================================
       UTILS
    ======================================== */
    function parseMday(md) {
      var p = String(md).split('/');
      return new Date(new Date().getFullYear(), parseInt(p[0], 10) - 1, parseInt(p[1], 10));
    }

    function getCheckedKey(projIdx) {
      return CHECKED_KEY + '-' + projIdx;
    }
    function getCheckedIndex(projIdx) {
      var raw = localStorage.getItem(getCheckedKey(projIdx));
      return raw !== null ? parseInt(raw, 10) : null;
    }
    function setCheckedIndex(projIdx, idx) {
      if (idx === null) localStorage.removeItem(getCheckedKey(projIdx));
      else localStorage.setItem(getCheckedKey(projIdx), String(idx));
    }

    function getViewMode() {
      return localStorage.getItem(VIEW_KEY) === 'edit' ? 'edit' : 'view';
    }
    function setViewMode(m) {
      localStorage.setItem(VIEW_KEY, m);
    }

    function loadDraft() {
      try {
        var raw = localStorage.getItem(SAVED_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }
    function saveDraft(data) {
      localStorage.setItem(SAVED_KEY, JSON.stringify(data));
    }
    function clearDraft() {
      localStorage.removeItem(SAVED_KEY);
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"')
        .replace(/'/g, ''');
    }

    /* ========================================
       DETECT CONFLICTS
       (phases that overlap in time)
    ======================================== */
    function detectConflicts(projects) {
      // Collect all active (not-done) phases across projects
      var active = [];
      projects.forEach(function(proj, pi) {
        proj.phases.forEach(function(phase, fi) {
          var s = parseMday(phase.startDate);
          var e = parseMday(phase.endDate);
          active.push({ proj: proj.name, phase: phase.title, s: s, e: e, pi: pi, fi: fi });
        });
      });

      var conflicts = [];
      for (var i = 0; i < active.length; i++) {
        for (var j = i + 1; j < active.length; j++) {
          var a = active[i], b = active[j];
          // overlap: a starts before b ends AND b starts before a ends
          if (a.s <= b.e && b.s <= a.e) {
            var label = a.proj + '「' + a.phase + '」與 ' + b.proj + '「' + b.phase + '」時段重疊';
            if (conflicts.indexOf(label) === -1) conflicts.push(label);
          }
        }
      }
      return conflicts;
    }

    /* ========================================
       RENDER: VIEW MODE
    ======================================== */
    function renderAllTimelines() {
      var container = document.getElementById('projects-container');
      var today = new Date();
      var html = '';

      state.projects.forEach(function(proj, projIdx) {
        html += '<div class="project-section">';
        html += '<div class="project-header">';
        html += '<div class="project-title">' + escapeHtml(proj.name) + '</div>';
        html += '<div class="project-meta">' + proj.phases.length + ' 階段</div>';
        html += '</div>';
        html += '<div class="timeline" data-proj="' + projIdx + '">';

        var checkedIdx = getCheckedIndex(projIdx);

        proj.phases.forEach(function(phase, i) {
          var s = parseMday(phase.startDate);
          var e = parseMday(phase.endDate);
          var diff = Math.ceil((e - today) / 86400000);
          var cls = 'phase';
          var header = '';
          var daysNum = '';
          var daysUnit = '';
          var isChecked = (i === checkedIdx);

          if (checkedIdx !== null) {
            if (i < checkedIdx) {
              cls += ' done';
              header = '完成';
              daysNum = '✓';
              daysUnit = '';
            } else if (i === checkedIdx) {
              if (diff < 0 || diff === 0) {
                cls += ' urgent';
                header = '已逾期';
                daysNum = Math.abs(diff) || '0';
              } else if (diff <= 2) {
                cls += ' warning';
                header = '還剩';
                daysNum = diff;
              } else {
                cls += ' current';
                header = '還剩';
                daysNum = diff;
              }
              daysUnit = '天';
            } else {
              cls += ' pending';
              header = '預計';
              daysNum = Math.ceil((e - s) / 86400000) + 1;
              daysUnit = '天';
            }
          } else {
            cls += ' pending';
            header = '預計';
            daysNum = Math.ceil((e - s) / 86400000) + 1;
            daysUnit = '天';
          }

          html += '<label class="' + cls + '" data-proj="' + projIdx + '" data-idx="' + i + '">';
          html += '<div class="checkbox"><input type="checkbox"' + (isChecked ? ' checked' : '') + '></div>';
          html += '<div class="title">' + escapeHtml(phase.title) + '</div>';
          html += '<div class="date">' + escapeHtml(phase.startDate) + ' – ' + escapeHtml(phase.endDate) + '</div>';
          html += '<div class="header">' + header + '</div>';
          html += '<div class="days">' + daysNum + '</div>';
          html += '<div class="days-unit">' + daysUnit + '</div>';
          html += '</label>';
        });

        html += '</div></div>';
      });

      container.innerHTML = html;

      // Wire up checkboxes
      container.querySelectorAll('.phase input[type="checkbox"]').forEach(function(cb) {
        cb.onchange = function(e) {
          var label = e.target.closest('.phase');
          var projIdx = parseInt(label.dataset.proj, 10);
          var idx = parseInt(label.dataset.idx, 10);
          setCheckedIndex(projIdx, e.target.checked ? idx : null);
          renderAllTimelines();
        };
      });
    }

    /* ========================================
       RENDER: EDIT MODE
    ======================================== */
    function renderEditor() {
      var editor = document.getElementById('editor');
      var draft = state.editDraft;

      var projRows = '';
      draft.forEach(function(proj, pi) {
        var phaseRows = '';
        proj.phases.forEach(function(phase, fi) {
          phaseRows += '<div class="edit-row" data-proj="' + pi + '" data-phase="' + fi + '">';
          phaseRows += '<input type="text" class="phase-title"   placeholder="任務名稱" value="' + escapeHtml(phase.title) + '">';
          phaseRows += '<input type="text" class="phase-start"    placeholder="M/D"      value="' + escapeHtml(phase.startDate) + '">';
          phaseRows += '<input type="text" class="phase-end"      placeholder="M/D"      value="' + escapeHtml(phase.endDate) + '">';
          phaseRows += '<button class="del phase-del" type="button" title="刪除">×</button>';
          phaseRows += '</div>';
        });

        projRows += '<div class="proj-row" data-proj="' + pi + '">';
        projRows += '<div style="display:flex;gap:8px;align-items:center;">';
        projRows += '<input type="text" class="proj-name" placeholder="專案名稱" value="' + escapeHtml(proj.name) + '">';
        projRows += '<button class="del proj-del" type="button" title="刪除專案">×</button>';
        projRows += '</div>';
        projRows += '</div>';
        projRows += '<div class="phase-edit-block" data-proj="' + pi + '">';
        projRows += '<div class="phase-rows">' + phaseRows + '</div>';
        projRows += '<button class="add-row phase-add" type="button">+ 新增任務</button>';
        projRows += '</div>';
      });

      editor.innerHTML =
        '<div class="editor-head">' +
          '<h2>✎ 編輯模式</h2>' +
          '<div class="editor-actions">' +
            '<button class="btn btn-primary" id="btn-save" type="button">💾 儲存並下載 HTML</button>' +
            '<button class="btn"            id="btn-cancel" type="button">取消</button>' +
          '</div>' +
        '</div>' +
        '<div class="editor-rows" id="editor-rows">' +
          projRows +
        '</div>' +
        '<button class="add-row" id="btn-add-proj" type="button">+ 新增專案</button>' +
        '<div class="editor-foot">' +
          '<span>💡 儲存後自動下載更新後的 HTML 檔案，手動覆蓋 <code>progress-tracker.html</code> 即可。</span>' +
        '</div>';

      // Project name change
      editor.querySelectorAll('.proj-name').forEach(function(inp) {
        inp.oninput = function(e) {
          var pi = parseInt(e.target.closest('.proj-row').dataset.proj, 10);
          state.editDraft[pi].name = e.target.value;
          saveDraft(state.editDraft);
        };
      });

      // Delete project
      editor.querySelectorAll('.proj-del').forEach(function(btn) {
        btn.onclick = function() {
          var pi = parseInt(btn.closest('.proj-row').dataset.proj, 10);
          state.editDraft.splice(pi, 1);
          saveDraft(state.editDraft);
          renderEditor();
        };
      });

      // Phase field changes
      editor.querySelectorAll('.edit-row').forEach(function(row) {
        var pi = parseInt(row.dataset.proj, 10);
        var fi = parseInt(row.dataset.phase, 10);
        row.querySelector('.phase-title').oninput = function(e) {
          state.editDraft[pi].phases[fi].title = e.target.value;
          saveDraft(state.editDraft);
        };
        row.querySelector('.phase-start').oninput = function(e) {
          state.editDraft[pi].phases[fi].startDate = e.target.value;
          saveDraft(state.editDraft);
        };
        row.querySelector('.phase-end').oninput = function(e) {
          state.editDraft[pi].phases[fi].endDate = e.target.value;
          saveDraft(state.editDraft);
        };
        row.querySelector('.phase-del').onclick = function() {
          state.editDraft[pi].phases.splice(fi, 1);
          saveDraft(state.editDraft);
          renderEditor();
        };
      });

      // Add phase
      editor.querySelectorAll('.phase-add').forEach(function(btn) {
        btn.onclick = function() {
          var pi = parseInt(btn.closest('.phase-edit-block').dataset.proj, 10);
          state.editDraft[pi].phases.push({ title: '', startDate: '', endDate: '' });
          saveDraft(state.editDraft);
          renderEditor();
        };
      });

      // Add project
      document.getElementById('btn-add-proj').onclick = function() {
        state.editDraft.push({ name: '新專案', phases: [{ title: '新任務', startDate: '7/01', endDate: '7/10' }] });
        saveDraft(state.editDraft);
        renderEditor();
      };

      // Cancel
      document.getElementById('btn-cancel').onclick = function() {
        clearDraft();
        state.editDraft = null;
        setViewMode('view');
        state.mode = 'view';
        render();
      };

      // Save → download updated HTML
      document.getElementById('btn-save').onclick = function() {
        // Update CONFIG in the page
        var cfg = { updatedAt: new Date().toISOString().slice(0, 10), projects: state.editDraft };
        var html = document.documentElement.outerHTML;
        // Replace the CONFIG variable
        html = html.replace(
          /var CONFIG = \{[\s\S]*?\};(\s*\/\* ========================================\s*STATE)/,
          'var CONFIG = ' + JSON.stringify(cfg, null, 2) + ';\n$1'
        );
        // Trigger download
        var blob = new Blob([html], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'progress-tracker.html';
        a.click();
        URL.revokeObjectURL(url);

        // Apply locally too
        state.projects = JSON.parse(JSON.stringify(state.editDraft));
        clearDraft();
        state.editDraft = null;
        setViewMode('view');
        state.mode = 'view';
        render();
      };
    }

    /* ========================================
       MAIN RENDER
    ======================================== */
    function render() {
      var editor = document.getElementById('editor');
      var container = document.getElementById('projects-container');
      var toggle = document.getElementById('mode-toggle');

      // Conflict detection (always visible)
      var conflicts = detectConflicts(state.projects);
      var banner = document.getElementById('conflict-banner');
      var bannerText = document.getElementById('conflict-text');
      if (conflicts.length > 0) {
        banner.classList.add('visible');
        bannerText.textContent = conflicts.join('；');
      } else {
        banner.classList.remove('visible');
      }

      if (state.mode === 'edit') {
        container.hidden = true;
        editor.hidden = false;
        toggle.textContent = '✓ 完成編輯';
        toggle.classList.add('active');
        if (!state.editDraft) {
          var draft = loadDraft();
          state.editDraft = draft && draft.projects && draft.projects.length
            ? draft.projects
            : JSON.parse(JSON.stringify(CONFIG.projects));
        }
        renderEditor();
      } else {
        container.hidden = false;
        editor.hidden = true;
        toggle.textContent = '✎ 編輯';
        toggle.classList.remove('active');
        renderAllTimelines();
      }

      // Updated at
      document.getElementById('updated-at').textContent = '更新日期：' + (CONFIG.updatedAt || '—');
    }

    /* ========================================
       BOOT
    ======================================== */
    (function() {
      state.projects = JSON.parse(JSON.stringify(CONFIG.projects));
      state.mode = getViewMode();
      if (state.mode === 'edit') {
        var draft = loadDraft();
        state.editDraft = draft && draft.projects && draft.projects.length
          ? draft.projects
          : JSON.parse(JSON.stringify(CONFIG.projects));
      }

      document.getElementById('mode-toggle').onclick = function() {
        if (state.mode === 'view') {
          setViewMode('edit');
          state.mode = 'edit';
          state.editDraft = null;
        } else {
          clearDraft();
          state.editDraft = null;
          setViewMode('view');
          state.mode = 'view';
        }
        render();
      };

      render();
    })();
  </script>

</body>
</html>
