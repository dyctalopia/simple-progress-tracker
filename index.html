<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>進度追蹤</title>
  <style>
    /* ========================================
       Reset & Base
    ======================================== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg:        #0f1115;
      --surface:   #171a20;
      --surface-2: #1f232c;
      --border:    #252830;
      --text-pri:  #e8e8e8;
      --text-sec:  #6b7280;
      --done-text: #6b7280;
      --green:     #22c55e;
      --orange:    #f59e0b;
      --red:       #ef4444;
      --font:      "Inter", "Noto Sans TC", system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-pri);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center; /* Ensure everything is centered horizontally */
      padding: 40px 16px;
    }

    /* ========================================
       Header
    ======================================== */
    .page-header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .page-hint {
      font-size: 0.75rem;
      color: var(--text-sec);
    }

    .mode-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-pri);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-toggle:hover { border-color: var(--text-pri); }
    .mode-toggle.active { background: rgba(34, 197, 94, 0.1); border-color: var(--green); color: var(--green); }

    /* ========================================
       Conflict Banner
    ======================================== */
    .conflict-banner {
      width: 100%;
      max-width: 1100px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--red);
      font-size: 0.85rem;
      margin-bottom: 24px;
      display: none;
    }
    .conflict-banner.visible { display: flex; align-items: center; gap: 8px; }

    /* ========================================
       Drag to Reorder
    ======================================== */
    .drag-hint { font-size: 0.7rem; color: #666; cursor: grab; user-select: none; }
    .project-section.dragging { opacity: 0.4; }
    .project-section.drag-over { border: 2px dashed #f59e0b; border-radius: 8px; }

    /* ========================================
       Projects Section
    ======================================== */
    #projects-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .project-section {
      width: 100%;
    }

    .project-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .project-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .project-meta {
      font-size: 0.75rem;
      color: var(--text-sec);
    }

    /* ========================================
       Timeline
    ======================================== */
    .timeline {
      display: flex;
      flex-wrap: wrap;
      justify-content: center; /* Centering cards */
      gap: 16px;
      width: 100%;
    }

    .phase {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      padding-top: 28px;
      min-width: 140px;
      max-width: 180px;
      text-align: center;
      flex: 1 1 140px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .phase:hover {
      border-color: var(--text-sec);
      transform: translateY(-2px);
    }

    .phase .checkbox {
      position: absolute;
      top: 12px;
      left: 12px;
    }

    .phase .checkbox input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      border: 2px solid var(--border);
      border-radius: 4px;
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      transition: all 0.2s;
    }

    .phase .checkbox input[type="checkbox"]:checked {
      background-color: var(--border);
    }

    .phase .checkbox input[type="checkbox"]::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 12px;
      color: white;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .phase.done    .checkbox input[type="checkbox"] { border-color: transparent; background-color: var(--border); }
    .phase.done .checkbox input[type="checkbox"]::after { color: var(--border); }
    .phase.done .title { color: var(--done-text); }
    .phase.done .header { color: var(--done-text); }

    .phase.current .checkbox input[type="checkbox"] { border-color: var(--green); background-color: var(--green); }
    .phase.current .checkbox input[type="checkbox"]::after { color: white; }
    .phase.current .header { color: var(--green); }
    .phase.current .days { color: var(--green); }

    .phase.warning .checkbox input[type="checkbox"] { border-color: var(--orange); }
    .phase.warning .header { color: var(--orange); }
    .phase.warning .days { color: var(--orange); }

    .phase.urgent .checkbox input[type="checkbox"] { border-color: var(--red); }
    .phase.urgent .header { color: var(--red); }
    .phase.urgent .days { color: var(--red); }

    .phase .title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
    .phase .date { font-size: 0.7rem; color: var(--text-sec); margin-bottom: 10px; }
    .phase .header { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; color: var(--text-sec); }
    .phase .days { font-size: 2.2rem; font-weight: 800; line-height: 1.1; color: var(--text-sec); margin-bottom: 2px; }
    .phase .days-unit { font-size: 0.6rem; font-weight: 600; color: var(--text-sec); text-transform: uppercase; }

    /* ========================================
       Editor Panel
    ======================================== */
    .editor {
      width: 100%;
      max-width: 1100px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 60px;
    }
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .editor-actions { display: flex; gap: 12px; }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-pri);
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--text-pri); }
    .btn-primary { background: var(--green); color: white; border-color: var(--green); }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-danger { color: var(--red); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }

    .proj-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      background: var(--surface-2);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .proj-row input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-pri);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1rem;
    }

    .phase-edit-group {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .phase-edit-group .group-title {
      font-size: 0.85rem;
      color: var(--text-sec);
      margin-bottom: 12px;
      display: block;
    }
    .edit-row {
      display: grid;
      grid-template-columns: 1fr 120px 120px 36px;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      position: relative;
      min-width: 0;
      width: 100%;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0;
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      margin: 0;
      padding: 0;
    }
    .edit-row input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-pri);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .edit-row .del {
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      color: var(--text-sec);
      cursor: pointer;
      font-size: 1.2rem;
    }
    .edit-row .del:hover { color: var(--red); }

    .add-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text-sec);
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .add-btn:hover { color: var(--green); border-color: var(--green); }

    .editor-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: right;
      font-size: 0.75rem;
      color: var(--text-sec);
    }

    @media (max-width: 640px) {
      .timeline { flex-direction: column; align-items: stretch; }
      .phase { min-width: unset; max-width: none; }
      .edit-row { grid-template-columns: 1fr 120px 120px 30px; }
      .proj-row { grid-template-columns: 1fr auto; }
    }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="title-group">
      <span style="font-size: 1.5rem;">📋</span>
      <div>
        <div class="page-title">進度追蹤</div>
        <div class="page-hint" id="updated-at">更新日期：--</div>
      </div>
    </div>
    <button class="mode-toggle" id="mode-toggle">✎ 編輯</button>
  </div>

  <div class="conflict-banner" id="conflict-banner">
    <span style="font-size: 1.2rem;">⚠</span>
    <span id="conflict-text"></span>
  </div>

  <div id="projects-container"></div>

  <div class="editor" id="editor" hidden>
    <div class="editor-header">
      <h2 style="font-size: 1.1rem; font-weight: 600;">編輯模式</h2>
      <div class="editor-actions">
        <button class="btn btn-primary" id="btn-save">💾 儲存進度</button>
        <button class="btn" id="btn-cancel">取消</button>
      </div>
    </div>
    <div id="editor-content"></div>
    <div class="editor-footer">
      💡 使用本地 Server 時，點擊儲存將自動更新 progress.json。
    </div>
  </div>

  <script>
    /* ========================================
       CONFIG - EMBEDDED FALLBACK
       ★ DO NOT EDIT THIS MARKER LINE ★
       ======================================== */
    // @CONFIG_START
    var CONFIG = {
      updatedAt: '2026-07-01',
      projects: [
        {
          name: 'TNL-口腔司 2D 動畫',
          phases: [
            { title: '前置作業', startDate: '5/22', endDate: '5/23' },
            { title: '腳本定稿', startDate: '5/28', endDate: '6/15' },
            { title: '分鏡完稿', startDate: '6/16', endDate: '6/22' },
            { title: 'A Copy',   startDate: '6/23', endDate: '6/29' },
            { title: 'B Copy',   startDate: '6/30', endDate: '7/02' },
            { title: 'Final',    startDate: '7/03', endDate: '7/05' }
          ]
        }
      ]
    };
    // @CONFIG_END
    /* ========================================
       STATE & LOGIC
       ======================================== */
    const CHECKED_KEY = 'tracker-checked-indices';
    const EDIT_MODE_KEY = 'tracker-edit-mode';
    const DRAFT_KEY = 'tracker-edit-draft';

    let state = {
      projects: [],
      mode: 'view',
      editDraft: null,
      checkedIndices: {}
    };

    let draggedIdx = null;

    // M/D ↔ YYYY-MM-DD conversion for date inputs
    const _toDateValue = (md) => {
      if (!md || !/^\d+\/\d+$/.test(md)) return '';
      const [m, d] = md.split('/').map(Number);
      return `2026-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    };
    const _fromDateValue = (dv) => {
      if (!dv || !dv.includes('-')) return '';
      const [, m, d] = dv.split('-');
      return `${parseInt(m,10)}/${parseInt(d,10)}`;
    };
    const parseMday = (md) => {
      const p = String(md).split('/');
      if (p.length !== 2) return new Date();
      return new Date(new Date().getFullYear(), parseInt(p[0], 10) - 1, parseInt(p[1], 10));
    };
    const escapeHtml = (str) => {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    };

    function detectConflicts(projects) {
      const activePhases = [];
      projects.forEach((p, pi) => {
        p.phases.forEach((ph, fi) => {
          const s = parseMday(ph.startDate);
          const e = parseMday(ph.endDate);
          activePhases.push({ name: `${p.name} [${ph.title}]`, start: s, end: e });
        });
      });
      const conflicts = [];
      for (let i = 0; i < activePhases.length; i++) {
        for (let j = i + 1; j < activePhases.length; j++) {
          const a = activePhases[i], b = activePhases[j];
          if (a.start <= b.end && b.start <= a.end) {
            conflicts.push(`${a.name} ↔ ${b.name}`);
          }
        }
      }
      return [...new Set(conflicts)];
    }

    async function init() {
      try {
        const res = await fetch('./progress.json');
        if (res.ok) {
          const data = await res.json();
          state.projects = data.projects;
          CONFIG.projects = data.projects;
          CONFIG.updatedAt = data.updatedAt;
        } else { throw new Error(); }
      } catch (e) {
        console.warn('Using fallback data');
        state.projects = JSON.parse(JSON.stringify(CONFIG.projects));
      }

      state.mode = localStorage.getItem(EDIT_MODE_KEY) || 'view';
      state.checkedIndices = JSON.parse(localStorage.getItem(CHECKED_KEY) || '{}');
      const savedDraft = localStorage.getItem(DRAFT_KEY);
      if (savedDraft) {
        try {
          const parsed = JSON.parse(savedDraft);
          // 如果是舊版 Array 格式，自動包裝成物件
          state.editDraft = Array.isArray(parsed) ? { projects: parsed } : parsed;
        } catch (e) {
          state.editDraft = { projects: JSON.parse(JSON.stringify(state.projects)) };
        }
      } else {
        state.editDraft = { projects: JSON.parse(JSON.stringify(state.projects)) };
      }

      render();
    }

    function render() {
      const mode = state.mode;
      const container = document.getElementById('projects-container');
      const editor = document.getElementById('editor');
      const toggle = document.getElementById('mode-toggle');
      const updatedAt = document.getElementById('updated-at');
      const conflicts = detectConflicts(state.projects);

      // 衝突警告區塊已停用（保留 detectConflicts() 以便日後恢復）
      // const banner = document.getElementById('conflict-banner'); if (conflicts.length > 0) { banner.classList.add('visible'); document.getElementById('conflict-text').innerText = conflicts.join('；'); } else { banner.classList.remove('visible'); }
      document.getElementById('conflict-banner').classList.remove('visible');

      if (mode === 'edit') {
        editor.hidden = false;
        container.hidden = true;
        toggle.innerText = '✓ 完成編輯';
        toggle.classList.add('active');
        renderEditor();
      } else {
        editor.hidden = true;
        container.hidden = false;
        toggle.innerText = '✎ 編輯';
        toggle.classList.remove('active');
        renderTimeline();
      }
      updatedAt.innerText = '更新日期：' + CONFIG.updatedAt;
    }

    function renderTimeline() {
      const container = document.getElementById('projects-container');
      container.innerHTML = '';
      state.projects.forEach((proj, pIdx) => {
        const section = document.createElement('div');
        section.className = 'project-section';
        section.draggable = true;
        section.dataset.pIdx = pIdx;
        section.innerHTML = `
          <div class="project-header">
            <div class="project-title">${escapeHtml(proj.name)}</div>
            <div class="project-meta">${proj.phases.length} 階段 <span class="drag-hint">⋮⋮ 拖曳移動</span></div>
          </div>
          <div class="timeline" data-proj="${pIdx}"></div>
        `;
        // === drag to reorder ===
        section.addEventListener('dragstart', (e) => {
          draggedIdx = pIdx;
          section.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        section.addEventListener('dragend', () => {
          section.classList.remove('dragging');
          draggedIdx = null;
          document.querySelectorAll('.project-section').forEach(s => s.classList.remove('drag-over'));
        });
        section.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; section.classList.add('drag-over'); });
        section.addEventListener('dragleave', () => section.classList.remove('drag-over'));
        section.addEventListener('drop', (e) => {
          e.preventDefault();
          section.classList.remove('drag-over');
          if (draggedIdx === null) return;
          // 以 drop target 的即時 DOM 位置為準
          const dropSections = [...document.querySelectorAll('.project-section')];
          const targetPIdx = dropSections.indexOf(section);
          if (targetPIdx < 0 || draggedIdx === targetPIdx) { draggedIdx = null; return; }
          const arr = [...state.projects];
          const [moved] = arr.splice(draggedIdx, 1);
          arr.splice(targetPIdx, 0, moved);
          // 重建 checkedIndices：根據新排列找到各專案原先的 checkedIndices
          const ci = state.checkedIndices;
          const oldIndexAtNew = {}; // newIndex -> oldIndex
          arr.forEach((proj, newIdx) => {
            const oldIdx = state.projects.findIndex(p => p.name === proj.name);
            if (oldIdx >= 0) oldIndexAtNew[newIdx] = oldIdx;
          });
          const newCi = {};
          arr.forEach((_, newIdx) => {
            const oldIdx = oldIndexAtNew[newIdx];
            if (oldIdx !== undefined && ci[oldIdx] !== undefined) {
              newCi[newIdx] = ci[oldIdx];
            }
          });
          state.projects = arr;
          state.checkedIndices = newCi;
          draggedIdx = null;
          saveProgress();
          renderTimeline();
        });
        // ========================
        const timeline = section.querySelector('.timeline');
        const lastChecked = state.checkedIndices[pIdx];

        proj.phases.forEach((ph, phIdx) => {
          const start = parseMday(ph.startDate);
          const end = parseMday(ph.endDate);
          const today = new Date(); today.setHours(0,0,0,0);
          let cls = 'phase', header = '預計', days = Math.ceil((end - start) / 86400000) + 1, daysTxt = '天', isChecked = phIdx < (lastChecked ?? -1);
          if (lastChecked !== null) {
            if (phIdx < lastChecked) { cls += ' done'; header = '完成'; days = '✓'; daysTxt = ''; }
            else if (phIdx === lastChecked) {
              const diff = Math.ceil((end - today) / 86400000);
              if (diff < 0) { cls += ' urgent'; header = '已逾期'; days = Math.abs(diff) || 0; }
              else if (diff <= 2) { cls += ' warning'; header = '還剩'; days = diff; }
              else { cls += ' current'; header = '還剩'; days = diff; }
            }
          }
          const card = document.createElement('div');
          card.className = cls;
          card.innerHTML = `<div class="checkbox"><input type="checkbox" ${isChecked ? 'checked' : ''}></div>
                             <div class="title">${escapeHtml(ph.title)}</div>
                             <div class="date">${escapeHtml(ph.startDate)} – ${escapeHtml(ph.endDate)}</div>
                             <div class="header">${header}</div><div class="days">${days}</div><div class="days-unit">${daysTxt}</div>`;
          card.onclick = (e) => {
            if (e.target.tagName === 'INPUT') return;
            const newIdx = phIdx;
            const currentIdx = state.checkedIndices[pIdx];
            if (currentIdx === newIdx) state.checkedIndices[pIdx] = null; else state.checkedIndices[pIdx] = newIdx;
            localStorage.setItem(CHECKED_KEY, JSON.stringify(state.checkedIndices));
            renderTimeline();
          };
          timeline.appendChild(card);
        });
        container.appendChild(section);
      });
    }

    function renderEditor() {
      const content = document.getElementById('editor-content');
      content.innerHTML = '';
      state.editDraft.projects.forEach((proj, pIdx) => {
        const group = document.createElement('div');
        group.className = 'phase-edit-group';
        group.innerHTML = `
          <div class="proj-row">
            <input type="text" class="proj-name-in" value="${escapeHtml(proj.name)}">
            <button class="btn btn-danger proj-del-btn" data-pidx="${pIdx}">刪除專案</button>
          </div>
          <div class="phase-rows"></div>
          <button class="add-btn add-phase-btn" data-pidx="${pIdx}">+ 新增階段</button>
        `;
        const phaseRows = group.querySelector('.phase-rows');
        proj.phases.forEach((ph, phIdx) => {
          const row = document.createElement('div');
          row.className = 'edit-row';
          row.innerHTML = `
            <input type="text" class="ph-title-in" value="${escapeHtml(ph.title)}">
            <input type="date" class="ph-start-in" value="${_toDateValue(ph.startDate)}">
            <input type="date" class="ph-end-in"   value="${_toDateValue(ph.endDate)}">
            <button class="btn-del-ph btn-danger" data-pidx="${pIdx}" data-phidx="${phIdx}">×</button>
          `;
          phaseRows.appendChild(row);
        });
        content.appendChild(group);
        const projNameInput = group.querySelector('.proj-name-in');
        projNameInput.oninput = (e) => {
          proj.name = e.target.value;
          saveDraft();
        };
        group.querySelector('.proj-del-btn').onclick = () => {
          state.editDraft.projects.splice(pIdx, 1);
          saveDraft();
          renderEditor();
        };
        const phaseInputs = group.querySelectorAll('.edit-row');
        phaseInputs.forEach((rowEl, phIdx) => {
          const titleInput = rowEl.querySelector('.ph-title-in');
          const startInput = rowEl.querySelector('.ph-start-in');
          const endInput   = rowEl.querySelector('.ph-end-in');
          titleInput.oninput = (e) => { proj.phases[phIdx].title = e.target.value; saveDraft(); };
          startInput.oninput = (e) => { proj.phases[phIdx].startDate = _fromDateValue(e.target.value); saveDraft(); };
          endInput.oninput   = (e) => { proj.phases[phIdx].endDate   = _fromDateValue(e.target.value); saveDraft(); };
        });
        group.querySelectorAll('.btn-del-ph').forEach(el => {
          el.onclick = () => { proj.phases.splice(el.dataset.phidx, 1); saveDraft(); renderEditor(); };
        });
        group.querySelector('.add-phase-btn').onclick = () => { proj.phases.push({ title: '', startDate: '', endDate: '' }); saveDraft(); renderEditor(); };
      });
      const addProjBtn = document.createElement('button');
      addProjBtn.className = 'add-btn';
      addProjBtn.innerText = '+ 新增專案';
      addProjBtn.onclick = () => { state.editDraft.projects.push({ name: '新專案', phases: [{ title: '', startDate: '', endDate: '' }] }); saveDraft(); renderEditor(); };
      content.appendChild(addProjBtn);
    }

    function saveDraft() { localStorage.setItem(DRAFT_KEY, JSON.stringify(state.editDraft)); }

    document.getElementById('mode-toggle').onclick = () => {
      state.mode = (state.mode === 'view' ? 'edit' : 'view');
      localStorage.setItem(EDIT_MODE_KEY, state.mode);
      if (state.mode === 'view') {
        localStorage.removeItem(DRAFT_KEY);
        state.editDraft = JSON.parse(JSON.stringify(state.projects));
      }
      render();
    };
    document.getElementById('btn-cancel').onclick = () => {
      localStorage.removeItem(DRAFT_KEY);
      state.mode = 'view';
      localStorage.setItem(EDIT_MODE_KEY, 'view');
      render();
    };

    const saveProgress = async () => {
      const newCfg = {
        updatedAt: new Date().toISOString().slice(0, 10),
        projects: state.projects,
        checkedIndices: state.checkedIndices
      };
      localStorage.setItem(CHECKED_KEY, JSON.stringify(state.checkedIndices));
      CONFIG.projects = JSON.parse(JSON.stringify(state.projects));
      CONFIG.updatedAt = newCfg.updatedAt;
      try {
        const res = await fetch('/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newCfg)
        });
        if (!res.ok) throw new Error();
      } catch (_) { /* server not running, local only */ }
    };

    document.getElementById('btn-save').onclick = async () => {
      const btn = document.getElementById('btn-save');
      const originalText = btn.innerText;
      btn.disabled = true;
      btn.innerText = '儲存中...';

      const newCfg = {
        updatedAt: new Date().toISOString().slice(0, 10),
        projects: state.editDraft.projects,
        checkedIndices: state.checkedIndices
      };

      try {
        const res = await fetch('/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newCfg)
        });
        if (!res.ok) throw new Error('Server error');

        alert('儲存成功！');
        state.projects = JSON.parse(JSON.stringify(newCfg.projects));
        state.checkedIndices = newCfg.checkedIndices;
        state.mode = 'view';
        localStorage.setItem(EDIT_MODE_KEY, 'view');
        render();
      } catch (e) {
        alert('儲存失敗：無法連接到 Server，請確認 Python 伺服器是否已啟動。');
        console.error(e);
      } finally {
        btn.disabled = false;
        btn.innerText = originalText;
      }
    };

    init();
  </script>
</body>
</html>
